<!DOCTYPE html>
<html>
  <head>
    <title>King of Fish test page</title>
    <link rel="stylesheet" type="text/css" href="./css/kingOfFishTest.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  </head>
  <body>
    <h1>King of Fish test page</h1>
    <button id="start-game-button">Start Game</button>
    <div id="game-screen">
      <div id="bot-container">
        <!--
        <h2>Bot Cards (<span id="bot-score">0</span>):</h2>
        <table>
          <tbody id="bot-hand" playerid=1>
          </tbody>
        </table>
        -->
      </div>

      <div id="player-container">
        <h2>Player Cards (<span id="player-score">0</span>):</h2> 
        <table>
          <tbody id="player-0" playerid=0>
          </tbody>
        </table>
      </div>

      <div>
        <h2>Deck and Discard Pile</h2>
        <p>Deal Pile</p>
        <table>
          <tbody id="deal-pile"></tbody>
        </table>
        <p>Discard Pile</p>
        <table>
          <tbody id="discard-pile"></tbody>
        </table>
      </div>

      <div id="player-choice-div"> 
        <button id="soft-swap-button">Soft Swap</button>
        <button id="hard-swap-button">Hard Swap</button>
        <button id="play-button">Play</button>
        <button id="pickup-button">Pick-up</button>
      </div>
    </div>
    <script type="module" src="./js/updatedTestKingOfFishHandler.js"></script>
  </body>
</html>
