<!DOCTYPE html>
<html>
  <head>
    <title>King of Fish test page</title>
    <link rel="stylesheet" type="text/css" href="./css/kingOfFishTest.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  </head>
  <body>
    <h1>King of Fish test page</h1>
    <button>Start Game</button>
    <div id="game-screen">
      <div id="bot-container">
        <h2>Bot Cards (<span id="bot-score">0</span>):</h2>
        <table>
          <tbody id="bot-hand">
            <td>9H</td>
            <td>6D</td>
          </tbody>
        </table>
      </div>

      <div id="player-container">
        <h2>Player Cards (<span id="player-score">0</span>):</h2> 
        <table>
          <tbody id="player-hand">
            <td class="selected">3D</td>
            <td>1C</td>
            <td>9C</td>
            <td>13C</td>
          </tbody>
        </table>
      </div>

      <div id="player-choice-div"> 
        <button>Soft Swap</button>
        <button>Hard Swap</button>
        <button>Play</button>
        <button>Pick-up</button>
      </div>
    </div>
    <script src="./js/testKingOfFishHandler.js"></script>
  </body>
</html>
