<!DOCTYPE html>
<html>
  <head>
    <title>King of Fish test page</title>
    <link rel="stylesheet" type="text/css" href="./css/kingOfFishTest.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  </head>
  <body>
    <h1>King of Fish test page</h1>
    <button id="start-game-button">Start Game</button>
    <label for="no-bots">Number of bots:</label>
    <select id="no-of-bots" name="no-bots">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <div id="player-console" style="float: right;">
      <table style="height: 600px; width: 400px; display: block; overflow: auto;">
        <thead>
          <tr>  
            <th>Player</th>
            <th>Message Log</th>
          </tr>
        </thead>
        <tbody id="player-message">
        </tbody>
      </table>
    </div>
    <script type="module" src="./js/updatedTestKingOfFishHandler.js"></script>
  </body>

    <div id="game-screen">
      <div id="players-container">
      </div>

      <div>
        <h2>Deck and Discard Pile</h2>
        <p>Deal Pile</p>
        <table>
          <tbody id="deal-pile"></tbody>
        </table>
        <p>Discard Pile</p>
        <table>
          <tbody id="discard-pile"></tbody>
        </table>
      </div>

      <div id="player-choice-div"> 
        <button id="soft-swap-button">Soft Swap</button>
        <button id="hard-swap-button">Hard Swap</button>
        <button id="play-button">Play</button>
        <button id="pickup-button">Pick-up</button>
      </div>
      <label for="players">Hard swap player:</label>
      <select id="other-players" name="players">
      </select>
 </html>
